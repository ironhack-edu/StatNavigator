site_name: Ironhack Statistical Test Navigator
site_description: Interactive guide for choosing and applying statistical methods

theme:
  name: material

markdown_extensions:
  - admonition
  - pymdownx.details

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Navigator: index.md
  - Test cards:
      - Welch's t-test: tests/welch-t-test.md
